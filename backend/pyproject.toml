[project]
name = "castminer-signer"
version = "0.1.0"
description = "CastMiner claim signer service. Holds the deployer PK and signs claim authorizations for the frontend."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "eth-account>=0.13.0",
    "eth-utils>=4.1.0",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
